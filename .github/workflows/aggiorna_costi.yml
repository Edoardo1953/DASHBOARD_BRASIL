name: 🔄 Auto-aggiorna Preload Dati (Costi e Ricavi)

on:
  push:
    paths:
      - 'Uploads/spese.xlsx'
      - 'DB Arcoiris Dashboard.xlsx'

jobs:
  genera-preload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installa dipendenze
        run: pip install openpyxl

      - name: Genera Preload Dati (Costi e Ricavi)
        run: |
          python scripts/make_costi_preload.py
          python scripts/make_db_preload.py

      - name: Commit e push file generati
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add costi_preload.js db_preload.js sombra_spa_db.json
          git diff --staged --quiet && echo "Nessuna modifica" || (
            git commit -m "auto: rigenera preload costi e ricavi da Excel aggiornati"
            git push
          )
